[package]
name = "fastsearch-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fastsearch = { path = ".." , default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
bincode = "1.3"
lz4_flex = "0.11"

[features]
default = ["embed-resources"]
embed-resources = []
