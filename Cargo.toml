[package]
name = "fastsearch"
version = "0.1.0"
edition = "2021"

[lib]
name = "fastsearch"
path = "src/lib.rs"

[[bin]]
name = "fastsearch"
path = "src/main.rs"

[[bin]]
name = "fastsearch-gui"
path = "src/gui/main.rs"

[dependencies]
windows = { version = "0.60", features = [
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI", 
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry"
] }
rayon = "1.10"
crossbeam-channel = "0.5"
fuzzy-matcher = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
lz4_flex = "0.11"
ctrlc = "3.5"
memmap2 = "0.9"
winreg = "0.52"
serde_json = "1"
tauri = { version = "1", features = ["global-shortcut-all", "system-tray", "window-hide", "window-show", "window-set-focus"] }

[build-dependencies]
tauri-build = { version = "1", features = [] }
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
