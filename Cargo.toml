[package]
name = "finder"
version = "0.2.1"
edition = "2021"

[lib]
name = "finder"
path = "src/lib.rs"

[[bin]]
name = "finder"
path = "src/main.rs"

[[bin]]
name = "Finder"
path = "src/gui/main.rs"

[dependencies]
windows = { version = "0.60", features = [
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI", 
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinInet"
] }
rayon = "1.10"
crossbeam-channel = "0.5"
fuzzy-matcher = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
lz4_flex = "0.11"
zstd = "0.13"
ctrlc = "3.5"
memmap2 = "0.9"
rustc-hash = "1"
winreg = "0.52"
serde_json = "1"
tauri = { version = "1", features = ["global-shortcut-all", "system-tray", "window-hide", "window-show", "window-set-focus", "clipboard-write-text", "updater"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
base64 = "0.21"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
# Required by cargo tauri build (the CLI always passes --features custom-protocol)
custom-protocol = ["tauri/custom-protocol"]
# Builds requiring an elevated manifest (the shipped exe) opt in explicitly:
#   cargo build --release --features embed-resources
embed-resources = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
