<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastSeek</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="spotlight" id="card">
      <div class="search-row">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search" autocomplete="off" spellcheck="false" placeholder="Spotlight Search" />
        <button class="settings-btn" id="settings" title="Search options">
          <svg id="cogIcon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
      <div class="rule"></div>
      <div id="status"><span id="statusText">Indexing...</span><div class="progress"><div id="progressFill"></div></div></div>
      <div class="expand-container">
        <div class="expand-content">
          <div class="divider"></div>
          <div class="options-list">
            <div class="option-item"><span class="option-label">Live file updates</span><span class="option-value">On</span></div>
            <div class="option-item"><span class="option-label">Applications first</span><span class="option-value">On</span></div>
            <div class="option-item"><span class="option-label">Web search</span><span class="option-value">.com + Enter</span></div>
          </div>
        </div>
      </div>
      <section id="results"></section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
